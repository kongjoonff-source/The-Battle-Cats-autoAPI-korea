<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<title>냥코 충전소 — 키 발급</title>
<link href='https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000010;--surface:rgba(20,20,40,0.7);--primary:#7c3aed;--primary2:#a855f7;--accent:#06b6d4;--success:#10b981;--danger:#ef4444;--text:#f1f5f9;--sub:#94a3b8;--border:rgba(168,85,247,0.25);--radius:20px}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 10%,rgba(124,58,237,0.25) 0%,transparent 50%),radial-gradient(ellipse 70% 50% at 90% 20%,rgba(6,182,212,0.2) 0%,transparent 50%),radial-gradient(ellipse 90% 70% at 50% 90%,rgba(236,72,153,0.18) 0%,transparent 55%);pointer-events:none;z-index:0;animation:nebula 12s ease-in-out infinite alternate}
@keyframes nebula{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-2%,1%) scale(1.05)}100%{transform:translate(2%,-1%) scale(1.02)}}
.gate-box{background:var(--surface);backdrop-filter:blur(24px) saturate(180%);border:1.5px solid var(--border);border-radius:var(--radius);padding:32px;max-width:480px;width:100%;position:relative;z-index:1;box-shadow:0 12px 48px rgba(124,58,237,0.3),inset 0 1px 0 rgba(255,255,255,0.05)}
.gate-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary2),var(--accent),transparent)}
.gate-title{text-align:center;margin-bottom:24px}
.gate-title h1{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#fff,var(--primary2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:gradientFlow 4s ease infinite;letter-spacing:2px}
@keyframes gradientFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.gate-title p{color:var(--sub);font-size:.82rem;margin-top:8px}
.input-wrap{position:relative;margin-bottom:12px}
input{width:100%;padding:14px 16px 14px 44px;border-radius:12px;border:2px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);outline:none;font-size:.85rem;font-family:'Exo 2',sans-serif;transition:all .3s}
input::placeholder{color:var(--sub)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(6,182,212,0.2),0 0 24px rgba(6,182,212,0.3);background:rgba(6,182,212,0.05)}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border-radius:14px;border:none;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .3s;width:100%;font-family:'Exo 2',sans-serif;letter-spacing:1px;margin-top:8px}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 6px 24px rgba(168,85,247,0.5)}
.btn-primary:hover{box-shadow:0 12px 36px rgba(168,85,247,0.7);transform:translateY(-2px)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--primary2));color:#fff;box-shadow:0 6px 24px rgba(6,182,212,0.5)}
.btn-accent:hover{box-shadow:0 12px 36px rgba(6,182,212,0.7);transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--sub);font-size:.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.toast{position:fixed;top:20px;right:20px;z-index:9999;background:rgba(20,20,40,0.95);backdrop-filter:blur(20px);border-radius:14px;padding:14px 18px;box-shadow:0 12px 40px rgba(0,0,0,0.6);border-left:4px solid var(--accent);max-width:340px;animation:toastIn .4s cubic-bezier(.34,1.56,.64,1);border:1px solid rgba(168,85,247,0.3);font-size:.82rem}
.toast strong{display:block;margin-bottom:4px;font-size:.9rem;font-weight:800}
@keyframes toastIn{from{transform:translateX(120%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.12);border-top-color:var(--accent);border-right-color:var(--primary2);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-msg{padding:12px 16px;border-radius:12px;font-size:.82rem;margin-top:12px;text-align:center;font-weight:600}
.status-msg.success{background:rgba(16,185,129,0.1);color:var(--success);border:1.5px solid rgba(16,185,129,0.3)}
.status-msg.error{background:rgba(239,68,68,0.1);color:var(--danger);border:1.5px solid rgba(239,68,68,0.3)}
</style>
</head>
<body>
<div class='gate-box'>
  <div class='gate-title'>
    <h1>냥코 충전소</h1>
    <p>키 발급하기 — 쿠폰 코드를 입력하세요</p>
  </div>
  {% if key_purchase_enabled %}
  <div class='input-wrap'>
    <input type='text' id='couponInput' placeholder='쿠폰 코드 입력' style='text-transform:uppercase'>
    <i class='fas fa-ticket input-icon'></i>
  </div>
  <button class='btn btn-accent' onclick='redeemCoupon()' id='redeemBtn'><i class='fas fa-key'></i> 키 발급하기</button>
  <div id='couponStatus'></div>
  <div class='divider'>또는 기존 키가 있는 경우</div>
  {% endif %}
  <div class='input-wrap'>
    <input type='text' id='keyInput' placeholder='접근 키 입력'>
    <i class='fas fa-key input-icon'></i>
  </div>
  <button class='btn btn-primary' onclick='verifyKey()' id='verifyBtn'><i class='fas fa-unlock'></i> 접속하기</button>
</div>
<script>
function redeemCoupon(){
  const code=document.getElementById('couponInput').value.trim();
  if(!code){toast('오류','쿠폰 코드를 입력하세요.');return;}
  const btn=document.getElementById('redeemBtn');
  btn.disabled=true;btn.innerHTML='<span class= spinner></span> 발급 중...';
  fetch('/api/redeem-coupon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})})
  .then(r=>r.json()).then(data=>{
    const s=document.getElementById('couponStatus');
    if(data.success){s.innerHTML='<div class=status-msg success><i class=fas fa-check-circle></i> '+data.message+'<br><small style=opacity:.7>키: '+data.key+'</small></div>';setTimeout(()=>{window.location.href='/';},1500);}
    else{s.innerHTML='<div class=status-msg error><i class=fas fa-times-circle></i> '+(data.error||'발급 실패')+'</div>';btn.disabled=false;btn.innerHTML='<i class=fas fa-key></i> 키 발급하기';toast('오류',data.error||'발급 실패');}
  }).catch(e=>{toast('오류','서버 연결 실패');btn.disabled=false;btn.innerHTML='<i class=fas fa-key></i> 키 발급하기';});
}
function verifyKey(){
  const key=document.getElementById('keyInput').value.trim();
  if(!key){toast('오류','키를 입력하세요.');return;}
  const btn=document.getElementById('verifyBtn');
  btn.disabled=true;btn.innerHTML='<span class=spinner></span> 확인 중...';
  fetch('/api/verify-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})})
  .then(r=>r.json()).then(data=>{if(data.success){window.location.href='/';}else{toast('오류',data.error||'유효하지 않은 키입니다');btn.disabled=false;btn.innerHTML='<i class=fas fa-unlock></i> 접속하기';}}).catch(e=>{toast('오류','서버 연결 실패');btn.disabled=false;btn.innerHTML='<i class=fas fa-unlock></i> 접속하기';});
}
function toast(t,m){const d=document.createElement('div');d.className='toast';d.innerHTML='<strong>'+t+'</strong>'+m;document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(120%)';setTimeout(()=>d.remove(),300);},5000);}
</script>
</body>
</html>
