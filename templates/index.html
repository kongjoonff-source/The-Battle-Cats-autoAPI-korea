<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱 냥코 자동충전 시스템 v10.0</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000010;
  --surface:rgba(20,20,40,0.7);
  --surface2:rgba(30,30,60,0.6);
  --primary:#7c3aed;
  --primary2:#a855f7;
  --accent:#06b6d4;
  --pink:#ec4899;
  --success:#10b981;
  --danger:#ef4444;
  --text:#f1f5f9;
  --sub:#94a3b8;
  --border:rgba(168,85,247,0.25);
  --radius:20px;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Exo 2',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 10%,rgba(124,58,237,0.25) 0%,transparent 50%),
    radial-gradient(ellipse 70% 50% at 90% 20%,rgba(6,182,212,0.2) 0%,transparent 50%),
    radial-gradient(ellipse 90% 70% at 50% 90%,rgba(236,72,153,0.18) 0%,transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 70%,rgba(251,191,36,0.1) 0%,transparent 50%);
  pointer-events:none;z-index:0;
  animation:nebula 12s ease-in-out infinite alternate;
}
@keyframes nebula{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  50%{transform:translate(-2%,1%) scale(1.05) rotate(1deg)}
  100%{transform:translate(2%,-1%) scale(1.02) rotate(-1deg)}
}
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(168,85,247,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(168,85,247,0.06) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;z-index:0;
  mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%);
}
.container{max-width:1000px;margin:0 auto;padding:16px;position:relative;z-index:1}

.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px;margin-bottom:24px;
  background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(6,182,212,0.15));
  backdrop-filter:blur(24px) saturate(200%);
  border:1.5px solid rgba(168,85,247,0.4);border-radius:var(--radius);
  box-shadow:0 8px 40px rgba(124,58,237,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
  position:relative;overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(168,85,247,0.15),transparent,transparent);
  animation:rotate 6s linear infinite;
}
@keyframes rotate{to{transform:rotate(360deg)}}
.logo{
  font-size:1.3rem;font-weight:900;
  background:linear-gradient(135deg,#fff,var(--primary2),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% 200%;animation:gradientFlow 4s ease infinite;
  letter-spacing:2px;position:relative;
}
@keyframes gradientFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.badge{
  font-size:.6rem;font-weight:800;padding:5px 12px;border-radius:20px;
  background:linear-gradient(135deg,rgba(124,58,237,0.4),rgba(6,182,212,0.3));
  border:1px solid rgba(168,85,247,0.5);color:#fff;
  box-shadow:0 0 20px rgba(168,85,247,0.4);letter-spacing:1px;
  position:relative;
}

.hero{
  text-align:center;padding:36px 24px;margin-bottom:24px;
  background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.1),rgba(236,72,153,0.12));
  border:2px solid rgba(168,85,247,0.3);border-radius:var(--radius);
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(124,58,237,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
}
.hero::before{
  content:'🚀';position:absolute;font-size:12rem;opacity:0.03;
  top:50%;left:50%;transform:translate(-50%,-50%);animation:float 8s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-30px)}}
.hero h1{
  font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,#fff,var(--primary2),var(--accent),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:300% 300%;animation:gradientFlow 5s ease infinite;
  margin-bottom:10px;position:relative;letter-spacing:2px;
}
.hero p{color:var(--sub);font-size:.85rem;position:relative;letter-spacing:1px}

.card{
  background:var(--surface);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:18px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05);
  transition:all .3s;position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--primary2),var(--accent),transparent);
  opacity:0.6;
}
.card:hover{border-color:rgba(168,85,247,0.5);transform:translateY(-2px);box-shadow:0 12px 40px rgba(124,58,237,0.3)}
.card-title{
  font-size:1.1rem;font-weight:800;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;color:#fff;letter-spacing:1px;
}
.card-title i{
  color:var(--accent);filter:drop-shadow(0 0 8px rgba(6,182,212,0.6));
  font-size:1.2rem;
}

.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab{
  padding:10px 18px;border-radius:12px;
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--sub);cursor:pointer;font-weight:700;font-size:.78rem;
  transition:all .25s;white-space:nowrap;letter-spacing:.5px;
}
.tab:hover{color:#fff;border-color:var(--primary2);box-shadow:0 0 16px rgba(168,85,247,0.3)}
.tab.active{
  background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(6,182,212,0.2));
  border-color:var(--primary2);color:#fff;
  box-shadow:0 0 24px rgba(168,85,247,0.5),inset 0 1px 0 rgba(255,255,255,0.1);
}

.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.item-card{
  background:var(--surface2);border:2px solid var(--border);border-radius:14px;
  padding:16px 10px;text-align:center;cursor:pointer;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;user-select:none;
}
.item-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(168,85,247,0.1),rgba(6,182,212,0.05));
  opacity:0;transition:opacity .3s;
}
.item-card:hover{transform:translateY(-5px) scale(1.03);border-color:var(--primary2);box-shadow:0 12px 32px rgba(124,58,237,0.4),inset 0 0 20px rgba(168,85,247,0.1)}
.item-card:hover::before{opacity:1}
.item-card.selected{
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(6,182,212,0.15));
  box-shadow:0 0 30px rgba(6,182,212,0.5),inset 0 0 30px rgba(168,85,247,0.15);
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(6,182,212,0.5)}50%{box-shadow:0 0 50px rgba(168,85,247,0.7)}}
.item-card.selected .item-icon{animation:iconPop .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 15px rgba(6,182,212,0.8))}
@keyframes iconPop{0%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.4) rotate(15deg)}100%{transform:scale(1.1) rotate(-5deg)}}
.item-icon{font-size:2.2rem;margin-bottom:8px;display:inline-block;transition:all .3s;position:relative;z-index:1}
.item-name{font-weight:700;font-size:.75rem;margin-bottom:4px;line-height:1.3;position:relative;z-index:1;letter-spacing:.5px}
.item-qty{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;position:relative;z-index:1}
.item-qty button{
  width:26px;height:26px;border-radius:50%;
  border:2px solid var(--border);background:rgba(255,255,255,0.08);
  color:#fff;cursor:pointer;font-size:.9rem;font-weight:800;
  transition:all .2s;display:flex;align-items:center;justify-content:center;
}
.item-qty button:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.15) rotate(90deg);box-shadow:0 0 16px rgba(6,182,212,0.6)}
.item-qty span{font-size:.9rem;font-weight:800;color:var(--accent);min-width:24px;text-align:center;text-shadow:0 0 10px rgba(6,182,212,0.5)}
.cat-inputs{margin-top:10px;position:relative;z-index:1}
.cat-inputs input,.cat-inputs label{display:block;width:100%;padding:8px 10px;font-size:.7rem;text-align:center;border-radius:8px;border:1.5px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);outline:none;margin-top:4px;font-family:'Exo 2',sans-serif}
.cat-inputs input:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(6,182,212,0.4)}

.cart-items{margin-top:12px}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08));
  border:1.5px solid rgba(168,85,247,0.3);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;font-size:.8rem;
  animation:slideIn .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
.cart-item-name{font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.cart-item-qty{color:var(--accent);font-weight:800;font-size:.95rem;text-shadow:0 0 8px rgba(6,182,212,0.5)}
.cart-item-remove{
  background:rgba(239,68,68,0.15);color:var(--danger);
  border:1.5px solid rgba(239,68,68,0.3);
  width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.7rem;
  transition:all .25s;display:flex;align-items:center;justify-content:center;
}
.cart-item-remove:hover{background:var(--danger);color:#fff;transform:rotate(90deg) scale(1.1);box-shadow:0 0 16px rgba(239,68,68,0.6)}

.total-box{
  background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(6,182,212,0.1));
  border:2px solid rgba(168,85,247,0.3);border-radius:14px;
  padding:16px;text-align:center;margin:16px 0;
  box-shadow:0 0 30px rgba(124,58,237,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
}
.total-box .label{font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:700}
.total-box .count{
  font-size:1.8rem;font-weight:900;
  background:linear-gradient(135deg,#fff,var(--primary2),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% 200%;animation:gradientFlow 3s ease infinite;margin-top:6px;
}

.input-wrap{position:relative;margin-bottom:12px}
input,textarea,select{
  width:100%;padding:14px 16px 14px 44px;border-radius:12px;
  border:2px solid var(--border);background:rgba(0,0,0,0.3);
  color:var(--text);outline:none;font-size:.85rem;
  font-family:'Exo 2',sans-serif;transition:all .3s;letter-spacing:.5px;
}
input::placeholder{color:var(--sub);font-size:.78rem;letter-spacing:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(6,182,212,0.2),0 0 24px rgba(6,182,212,0.3);background:rgba(6,182,212,0.05)}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:1rem;transition:all .3s}
input:focus + .input-icon{color:var(--accent);filter:drop-shadow(0 0 6px rgba(6,182,212,0.6))}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 24px;border-radius:14px;border:none;
  font-size:.95rem;font-weight:800;cursor:pointer;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  width:100%;font-family:'Exo 2',sans-serif;
  position:relative;overflow:hidden;letter-spacing:1px;
}
.btn:active{transform:scale(.96)}
.btn-success{
  background:linear-gradient(135deg,#10b981,#06b6d4,#3b82f6);
  color:#fff;box-shadow:0 6px 24px rgba(6,182,212,0.5);
}
.btn-success:hover{box-shadow:0 12px 36px rgba(6,182,212,0.7);transform:translateY(-3px);filter:brightness(1.15)}

.status-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;font-size:.8rem;margin-bottom:10px;font-weight:700;letter-spacing:.5px}
.status-bar.pending{background:linear-gradient(135deg,rgba(251,191,36,0.15),rgba(245,158,11,0.08));color:var(--accent);border:1.5px solid rgba(251,191,36,0.3);box-shadow:0 0 20px rgba(251,191,36,0.2)}
.status-bar.success{background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(52,211,153,0.08));color:var(--success);border:1.5px solid rgba(16,185,129,0.3);box-shadow:0 0 20px rgba(16,185,129,0.2)}
.status-bar.error{background:linear-gradient(135deg,rgba(239,68,68,0.15),rgba(239,68,68,0.08));color:var(--danger);border:1.5px solid rgba(239,68,68,0.3);box-shadow:0 0 20px rgba(239,68,68,0.2)}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-right-color:var(--primary2);border-radius:50%;animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}

.result-box{display:none;padding:20px;border-radius:16px;margin-top:16px}
.result-box.show{display:block;animation:resultIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.result-box.success{background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(6,182,212,0.08));border:2px solid rgba(16,185,129,0.4);box-shadow:0 0 40px rgba(16,185,129,0.3)}
.result-box.error{background:linear-gradient(135deg,rgba(239,68,68,0.15),rgba(236,72,153,0.08));border:2px solid rgba(239,68,68,0.4);box-shadow:0 0 40px rgba(239,68,68,0.3)}

.toast{position:fixed;top:20px;right:20px;z-index:9999;background:rgba(20,20,40,0.95);backdrop-filter:blur(20px);border-radius:14px;padding:14px 18px;box-shadow:0 12px 40px rgba(0,0,0,0.6);border-left:4px solid var(--accent);max-width:340px;animation:toastIn .4s cubic-bezier(.34,1.56,.64,1);border:1px solid rgba(168,85,247,0.3)}
.toast strong{display:block;margin-bottom:4px;font-size:.9rem;font-weight:800;letter-spacing:.5px}
.toast small{cursor:pointer;opacity:.6;display:block;margin-top:6px;font-size:.65rem;text-align:right}
@keyframes toastIn{from{transform:translateX(120%) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}

.particle{position:fixed;pointer-events:none;z-index:9998;border-radius:50%}
.confetti{position:fixed;pointer-events:none;z-index:9997}

@media(max-width:768px){.items-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.container{padding:12px}.hero{padding:24px 16px}.hero h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">🐱 NYANKO AUTO CHARGE <span class="badge">v10.0</span></div>
  </header>

  <div class="hero">
    <h1>냥코 자동충전 시스템</h1>
    <p>⚡ BCSFE ULTIMATE — 전체 기능 자동 충전 ⚡</p>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-rocket"></i>이용 방법</div>
    <ol style="padding-left:20px;color:var(--sub);font-size:.8rem;line-height:2;letter-spacing:.5px">
      <li>원하는 아이템/기능을 선택하세요</li>
      <li>기기이전 코드와 인증번호를 입력하세요</li>
      <li>"지급하기" 버튼으로 자동 충전</li>
      <li>완료 후 새 코드를 갤러리에 저장</li>
    </ol>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-cart-shopping"></i>아이템 선택</div>
    <div class="tabs" id="categoryTabs"></div>
    <div class="items-grid" id="itemsGrid"></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="total-box" id="totalBox" style="display:none;"><div class="label">선택 아이템</div><div class="count" id="totalCount">0</div></div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-key"></i>계정 정보</div>
    <div class="input-wrap"><input type="text" id="transferCode" placeholder="기기이전 코드 (16자리)"><i class="fas fa-mobile-screen input-icon"></i></div>
    <div class="input-wrap"><input type="text" id="confirmationCode" placeholder="인증번호 (8자리 숫자)"><i class="fas fa-shield-halved input-icon"></i></div>
  </div>

  <button class="btn btn-success" onclick="startProcess()" id="payButton"><i class="fas fa-rocket"></i> 지급하기</button>
  <div id="processResult"></div>
  <div id="statusArea"></div>
  <div class="result-box" id="resultBox"><h4 id="resultTitle"></h4><div id="resultContent"></div></div>
</div>

<script>
const items = {{ items|tojson }};
let cart = {};
let currentTab = '통조림';
const categories = [...new Set(items.map(i => i.category))];

function renderTabs(){
  const cont = document.getElementById('categoryTabs');
  cont.innerHTML = categories.map(c => `<div class="tab ${c===currentTab?'active':''}" onclick="switchTab('${c}')">${c}</div>`).join('');
}
function switchTab(cat){currentTab = cat; renderTabs(); renderItems();}

function renderItems(){
  const cont = document.getElementById('itemsGrid');
  const filtered = items.filter(i => i.category === currentTab);
  cont.innerHTML = filtered.map(item => {
    const qty = cart[item.id] || 0;
    const selected = qty > 0 ? 'selected' : '';
    let extraInputs = '';
    if (selected){
      if (item.needs_cat_id) extraInputs += `<div class="cat-inputs"><label>고양이 ID</label><input type="number" value="${cart[item.id+'_catId']||''}" oninput="saveCatId('${item.id}',this.value)"></div>`;
      if (item.needs_levels){
        extraInputs += `<div class="cat-inputs"><label>기본 레벨</label><input type="number" value="${cart[item.id+'_baseLv']||''}" oninput="saveLevels('${item.id}','base',this.value)"></div>`;
        extraInputs += `<div class="cat-inputs"><label>+ 레벨</label><input type="number" value="${cart[item.id+'_plusLv']||''}" oninput="saveLevels('${item.id}','plus',this.value)"></div>`;
      }
    }
    return `<div class="item-card ${selected}" onclick="toggleItem('${item.id}',event)" data-id="${item.id}">
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      ${selected?`<div style="position:absolute;top:6px;right:6px;background:var(--accent);color:#000;font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px;box-shadow:0 0 10px rgba(6,182,238,0.6)">선택됨 ${qty}개</div>`:''}
      ${selected?`<div class="item-qty"><button onclick="event.stopPropagation();changeQty('${item.id}',-1,event)">−</button><span>${qty}</span><button onclick="event.stopPropagation();changeQty('${item.id}',1,event)">+</button></div>`:''}
      ${extraInputs}
    </div>`;
  }).join('');
}

function saveCatId(id,val){cart[id+'_catId']=val; renderCart();}
function saveLevels(id,type,val){cart[id+'_'+type+'Lv']=val; renderCart();}

function toggleItem(id,e){
  if (cart[id]){delete cart[id]; delete cart[id+'_catId']; delete cart[id+'_baseLv']; delete cart[id+'_plusLv'];}
  else {cart[id]=1;}
  renderItems(); renderCart(); updateTotal();
}

function changeQty(id,delta,e){
  const n = (cart[id]||0)+delta;
  if (n<=0){delete cart[id]; delete cart[id+'_catId']; delete cart[id+'_baseLv']; delete cart[id+'_plusLv'];}
  else cart[id]=n;
  renderItems(); renderCart(); updateTotal();
}

function renderCart(){
  const cont = document.getElementById('cartItems');
  const entries = Object.entries(cart).filter(([k]) => items.some(i => i.id === k));
  if (!entries.length){cont.innerHTML='';return;}
  cont.innerHTML = entries.map(([id,qty])=>{
    const item = items.find(i => i.id === id);
    if (!item) return '';
    let extra='';
    if (item.needs_cat_id && cart[id+'_catId']) extra += ` (ID:${cart[id+'_catId']})`;
    if (item.needs_levels) extra += ` (Lv:${cart[id+'_baseLv']||'?'}+${cart[id+'_plusLv']||'?'})`;
    return `<div class="cart-item"><div class="cart-item-name"><span>${item.icon}</span> ${item.name}${extra}</div><div class="cart-item-right"><span class="cart-item-qty">x${qty}</span><button class="cart-item-remove" onclick="removeFromCart('${id}',event)">✕</button></div></div>`;
  }).join('');
}

function removeFromCart(id,e){
  delete cart[id]; delete cart[id+'_catId']; delete cart[id+'_baseLv']; delete cart[id+'_plusLv'];
  renderItems(); renderCart(); updateTotal();
}

function updateTotal(){
  const count = Object.entries(cart).filter(([k]) => items.some(i => i.id === k)).reduce((a,[,v]) => a+v, 0);
  const box = document.getElementById('totalBox');
  if (count>0){box.style.display='block'; document.getElementById('totalCount').textContent = count+'개';}
  else box.style.display='none';
}

async function submitAndProcess(){
  const t = document.getElementById('transferCode').value.trim();
  const c = document.getElementById('confirmationCode').value.trim();
  if (!t||!c){toast('입력 오류','코드를 입력하세요.','var(--danger)');return;}
  const cartEntries = Object.entries(cart).filter(([k]) => items.some(i => i.id === k));
  if (!cartEntries.length){toast('입력 오류','아이템을 선택하세요.','var(--danger)');return;}
  for (const [id] of cartEntries){
    const item = items.find(i => i.id === id);
    if (item && item.needs_cat_id && !cart[id+'_catId']){toast('입력 오류',item.name+'의 고양이 ID를 입력하세요.','var(--danger)');return;}
  }
  const btn = document.getElementById('payButton');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 처리 중...';
  try{
    const payloadItems = cartEntries.map(([id,qty])=>{const obj={id,quantity:qty}; const item=items.find(i=>i.id===id); if(item&&item.needs_cat_id) obj.cat_id=parseInt(cart[id+'_catId'])||-1; if(item&&item.needs_levels){obj.base_level=parseInt(cart[id+'_baseLv'])||-1; obj.plus_level=parseInt(cart[id+'_plusLv'])||-1;} return obj;});
    const res = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_name:'user',transfer_code:t,confirmation_code:c,items:payloadItems})});
    const data = await res.json();
    if (data.error){toast('오류',data.error,'var(--danger)');btn.disabled=false;btn.innerHTML='<i class="fas fa-rocket"></i> 지급하기';return;}
    const res2 = await fetch('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:data.order_id})});
    const data2 = await res2.json();
    if (data2.error){toast('오류',data2.error,'var(--danger)');btn.disabled=false;btn.innerHTML='<i class="fas fa-rocket"></i> 지급하기';return;}
    document.getElementById('processResult').innerHTML='<div class="status-bar pending"><span class="spinner"></span> 처리 중... (30초~1분)</div>';
    startPolling(data2.order_id);
  }catch(e){toast('오류','서버 연결 실패','var(--danger)');}
  btn.disabled=false; btn.innerHTML='<i class="fas fa-rocket"></i> 지급하기';
}

function startProcess(){submitAndProcess();}

let pollInterval=null;
function startPolling(orderId){
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async ()=>{
    try{
      const res = await fetch('/api/order/'+orderId);
      const order = await res.json();
      document.getElementById('statusArea').innerHTML = '<div class="card" style="border-color:rgba(168,85,247,0.3);"><div class="card-title"><i class="fas fa-arrows-rotate"></i>처리 현황</div><div class="status-bar '+(order.status==='processing'?'pending':order.status==='completed'?'success':'error')+'">'+(order.status==='processing'?'<span class="spinner"></span> 처리 중...':'')+(order.status==='completed'?'<i class="fas fa-check-circle"></i> 처리 완료!':'')+(order.status==='failed'?'<i class="fas fa-times-circle"></i> 처리 실패':'')+(order.status==='pending'?'<i class="fas fa-clock"></i> 대기 중':'')+'</div></div>';
      if (order.status==='completed'||order.status==='failed'){clearInterval(pollInterval);pollInterval=null;showResult(order);}
    }catch(e){}
  },2000);
}

function showResult(order){
  const rb=document.getElementById('resultBox'); const rt=document.getElementById('resultTitle'); const rc=document.getElementById('resultContent');
  rb.className='result-box show '+(order.status==='completed'?'success':'error');
  if (order.status==='completed'){
    const r=order.result||{};
    rt.innerHTML='<i class="fas fa-check-circle"></i> 충전 완료!';
    try{confetti();}catch(e){}
    let d='';
    if (r.details && r.details.length){d='<div style="margin-top:10px;font-size:.75rem;color:var(--sub);">'; r.details.forEach(x=>d+='<div>'+(x.success?'✅':'❌')+' '+x.message+'</div>'); d+='</div>';}
    rc.innerHTML='<div style="font-weight:800;color:var(--success);margin-bottom:8px;font-size:1rem;">🚀 새 코드 발급 완료!</div>'+
      '<div style="background:rgba(0,0,0,0.3);border:1.5px solid rgba(168,85,247,0.3);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;"><button onclick="copyCode(\'newTc\')" style="position:absolute;top:8px;right:8px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);color:var(--primary2);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;"><i class="fas fa-copy"></i></button><div style="font-size:.7rem;color:var(--accent);margin-bottom:4px;">📋 새 전송코드</div><div id="newTc" style="font-weight:800;color:var(--success);font-size:1.1rem;text-shadow:0 0 10px rgba(16,185,129,0.5);word-break:break-all;">'+(r.new_transfer_code||'N/A')+'</div></div>'+
      '<div style="background:rgba(0,0,0,0.3);border:1.5px solid rgba(168,85,247,0.3);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;"><button onclick="copyCode(\'newCc\')" style="position:absolute;top:8px;right:8px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);color:var(--primary2);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;"><i class="fas fa-copy"></i></button><div style="font-size:.7rem;color:var(--accent);margin-bottom:4px;">🔒 새 인증번호</div><div id="newCc" style="font-weight:800;color:var(--primary2);font-size:1.1rem;text-shadow:0 0 10px rgba(168,85,247,0.5);word-break:break-all;">'+(r.new_confirmation_code||'N/A')+'</div></div>'+
      d+'<button class="btn btn-success" onclick="saveAsImage()" style="margin-top:14px;"><i class="fas fa-image"></i> 이미지로 저장</button>';
  } else {
    rt.innerHTML='<i class="fas fa-times-circle"></i> 충전 실패';
    rc.innerHTML='<div style="color:var(--sub);font-size:.82rem;">'+(order.result?.error||'오류')+'</div>';
  }
  rb.scrollIntoView({behavior:'smooth'});
}

function saveAsImage(){
  const newTc = document.getElementById('newTc')?document.getElementById('newTc').textContent:'N/A';
  const newCc = document.getElementById('newCc')?document.getElementById('newCc').textContent:'N/A';
  toast('이미지 저장','이미지를 생성 중입니다...','var(--accent)');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width=800; canvas.height=500;
  const grad = ctx.createLinearGradient(0,0,800,500);
  grad.addColorStop(0,'#000010'); grad.addColorStop(0.5,'#0a0a1a'); grad.addColorStop(1,'#000010');
  ctx.fillStyle=grad; ctx.fillRect(0,0,800,500);
  ctx.strokeStyle='rgba(168,85,247,0.6)'; ctx.lineWidth=3; ctx.strokeRect(10,10,780,480);
  ctx.fillStyle='#a855f7'; ctx.font='bold 28px Exo 2,sans-serif'; ctx.textAlign='center';
  ctx.fillText('🐱 냥코 자동충전',400,55);
  ctx.fillStyle='#06b6d4'; ctx.font='16px Exo 2,sans-serif';
  ctx.fillText('새 기기이전 코드 & 인증번호',400,95);
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.strokeStyle='rgba(168,85,247,0.4)'; ctx.lineWidth=2;
  roundRect(ctx,40,120,720,140,16); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='bold 16px Exo 2,sans-serif'; ctx.textAlign='left';
  ctx.fillText('📋 새 전송코드',60,155);
  ctx.fillStyle='#34d399'; ctx.font='bold 24px monospace'; ctx.textAlign='center';
  ctx.fillText(newTc,400,225);
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.strokeStyle='rgba(168,85,247,0.4)';
  roundRect(ctx,40,290,720,140,16); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='bold 16px Exo 2,sans-serif'; ctx.textAlign='left';
  ctx.fillText('🔒 새 인증번호',60,325);
  ctx.fillStyle='#a855f7'; ctx.font='bold 24px monospace'; ctx.textAlign='center';
  ctx.fillText(newCc,400,395);
  ctx.fillStyle='#64748b'; ctx.font='12px Exo 2,sans-serif'; ctx.textAlign='center';
  ctx.fillText('생성일: '+new Date().toLocaleString('ko-KR'),400,455);
  ctx.fillText('BCSFE Ultimate v10.0',400,475);
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    if(isMobile){
      const w=window.open('','_blank');
      if(w){
        w.document.write('<html><head><title>이미지 저장</title><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}img{max-width:95%;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,0.5)}.info{color:#fff;text-align:center;margin:15px;font-size:14px;line-height:1.6}.info b{color:#a855f7}</style></head><body><img src="'+url+'" /><div class="info"><b>📌 갤러리에 저장하는 방법</b><br>이미지를 길게 누른 후 "이미지 저장" 또는 "사진 저장"을 선택하세요</div></body></html>');
        w.document.close();
        toast('이미지 열림','이미지를 길게 눌러 갤러리에 저장하세요.','var(--success)');
      } else { downloadImage(url); }
    } else { downloadImage(url); }
  },'image/png');
  function downloadImage(url){
    const a=document.createElement('a');
    a.download='nyanko-codes-'+Date.now()+'.png'; a.href=url;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast('저장 완료','이미지가 다운로드되었습니다.','var(--success)');
  }
}

function copyCode(id){
  const el=document.getElementById(id);
  if(!el){toast('복사 실패','코드를 찾을 수 없습니다.','var(--danger)');return;}
  const text=el.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('복사 완료','코드가 클립보드에 복사되었습니다.','var(--success)')).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
  function fallbackCopy(t){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('복사 완료','코드가 클립보드에 복사되었습니다.','var(--success)');}catch(e){toast('복사 실패','수동으로 복사해주세요.','var(--danger)');}
    document.body.removeChild(ta);
  }
}

function confetti(){
  const colors=['#a855f7','#06b6d4','#ec4899','#fbbf24','#10b981','#f59e0b'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    c.style.width=(6+Math.random()*8)+'px';c.style.height=(6+Math.random()*12)+'px';
    document.body.appendChild(c);
    const dur=2000+Math.random()*2000;
    c.animate([{transform:'translateY(0) rotate(0deg)',opacity:1},{transform:'translateY('+(window.innerHeight+40)+'px) rotate('+(720*Math.random())+'deg)',opacity:0}],{duration:dur,easing:'cubic-bezier(.3,.7,.5,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function toast(t,m,c){const d=document.createElement('div');d.className='toast';d.style.borderLeftColor=c||'var(--accent)';d.innerHTML='<strong>'+t+'</strong>'+m.replace(/\n/g,'<br>')+'<small onclick="this.parentElement.classList.add(\'out\');setTimeout(()=>this.parentElement.remove(),300)">닫기</small>';document.body.appendChild(d);setTimeout(()=>{if(d.parentElement){d.classList.add('out');setTimeout(()=>d.remove(),300);}},8000);}

document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(b){const rect=b.getBoundingClientRect();const ripple=document.createElement('span');ripple.className='ripple';ripple.style.width=ripple.style.height=Math.max(rect.width,rect.height)+'px';ripple.style.left=e.clientX-rect.left-Math.max(rect.width,rect.height)/2+'px';ripple.style.top=e.clientY-rect.top-Math.max(rect.width,rect.height)/2+'px';b.appendChild(ripple);setTimeout(()=>ripple.remove(),600);}});
renderTabs(); renderItems();
</script>
</body>
</html>
