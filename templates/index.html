<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BCSFE Ultimate v10.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --surface2:#1a1a25;
  --primary:#6366f1;
  --primary2:#818cf8;
  --accent:#22d3ee;
  --success:#10b981;
  --danger:#ef4444;
  --text:#f8fafc;
  --sub:#94a3b8;
  --border:rgba(99,102,241,0.15);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 10% 20%,rgba(99,102,241,0.15) 0%,transparent 50%),
    radial-gradient(ellipse 60% 40% at 90% 80%,rgba(34,211,238,0.1) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}
.container{max-width:960px;margin:0 auto;padding:16px;position:relative;z-index:1}
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;margin-bottom:20px;
  background:rgba(18,18,26,0.8);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:var(--radius);
}
.logo{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.badge{font-size:.65rem;font-weight:700;padding:4px 10px;border-radius:20px;background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(34,211,238,0.15));border:1px solid var(--border);color:var(--primary2)}

.hero{
  text-align:center;padding:28px 20px;margin-bottom:20px;
  background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(34,211,238,0.05));
  border:1px solid var(--border);border-radius:var(--radius);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(99,102,241,0.1),transparent,transparent);
  animation:rotate 8s linear infinite;
}
@keyframes rotate{to{transform:rotate(360deg)}}
.hero h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--primary2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;position:relative}
.hero p{color:var(--sub);font-size:.85rem;position:relative}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;transition:all .3s;
}
.card:hover{border-color:rgba(99,102,241,0.3);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.card-title{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title i{color:var(--primary2)}

.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--sub);cursor:pointer;font-weight:600;font-size:.8rem;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--text);border-color:rgba(99,102,241,0.3)}
.tab.active{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(34,211,238,0.1));border-color:var(--primary);color:var(--primary2);box-shadow:0 0 16px rgba(99,102,241,0.2)}

.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.item-card{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;
  padding:14px 10px;text-align:center;cursor:pointer;transition:all .25s;
  position:relative;overflow:hidden;user-select:none;
}
.item-card:hover{transform:translateY(-3px) scale(1.02);border-color:var(--primary);box-shadow:0 8px 24px rgba(99,102,241,0.2)}
.item-card.selected{
  border-color:var(--primary2);
  background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(34,211,238,0.08));
  box-shadow:0 0 20px rgba(99,102,241,0.3);
}
.item-card.selected .item-icon{animation:iconPop .4s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 10px rgba(129,140,248,0.6))}
@keyframes iconPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1.05)}}
.item-icon{font-size:2rem;margin-bottom:6px;display:inline-block;transition:transform .3s}
.item-name{font-weight:600;font-size:.75rem;margin-bottom:4px;line-height:1.3}
.item-qty{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.item-qty button{
  width:24px;height:24px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);cursor:pointer;
  font-size:.85rem;font-weight:700;transition:all .2s;display:flex;align-items:center;justify-content:center;
}
.item-qty button:hover{background:var(--primary);border-color:var(--primary);transform:scale(1.1)}
.item-qty span{font-size:.85rem;font-weight:700;color:var(--primary2);font-family:'Inter',monospace}
.cat-inputs{margin-top:8px}
.cat-inputs input,.cat-inputs label{display:block;width:100%;padding:6px 8px;font-size:.7rem;text-align:center;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text);outline:none;margin-top:4px}

.cart-items{margin-top:10px}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(34,211,238,0.03));
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:.8rem;
  animation:slideIn .3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.cart-item-name{font-weight:600;display:flex;align-items:center;gap:6px}
.cart-item-qty{color:var(--primary2);font-weight:700;font-family:'Inter',monospace}
.cart-item-remove{
  background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2);
  width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.65rem;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.cart-item-remove:hover{background:var(--danger);color:#fff;transform:rotate(90deg)}

.total-box{
  background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(34,211,238,0.05));
  border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:14px;text-align:center;margin:14px 0;
}
.total-box .label{font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.total-box .count{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--primary2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:4px}

.input-wrap{position:relative;margin-bottom:10px}
input,textarea,select{
  width:100%;padding:12px 14px 12px 40px;border-radius:10px;
  border:1.5px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text);
  outline:none;font-size:.85rem;font-family:inherit;transition:all .3s;
}
input::placeholder{color:var(--sub);font-size:.8rem}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.12)}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:.9rem;transition:color .3s}
input:focus + .input-icon{color:var(--primary2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:12px;border:none;
  font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;
  width:100%;font-family:inherit;position:relative;overflow:hidden;
}
.btn:active{transform:scale(.97)}
.btn-success{
  background:linear-gradient(135deg,#10b981,#34d399);color:#fff;
  box-shadow:0 4px 16px rgba(16,185,129,0.3);
}
.btn-success:hover{box-shadow:0 8px 24px rgba(16,185,129,0.4);transform:translateY(-2px)}

.status-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-size:.78rem;margin-bottom:8px;font-weight:600}
.status-bar.pending{background:linear-gradient(135deg,rgba(245,158,11,0.1),rgba(251,191,36,0.05));color:var(--accent);border:1px solid rgba(245,158,11,0.2)}
.status-bar.success{background:linear-gradient(135deg,rgba(16,185,129,0.1),rgba(52,211,153,0.05));color:var(--success);border:1px solid rgba(16,185,129,0.2)}
.status-bar.error{background:linear-gradient(135deg,rgba(239,68,68,0.1),rgba(239,68,68,0.05));color:var(--danger);border:1px solid rgba(239,68,68,0.2)}
.spinner{display:inline-block;width:14px;height:14px;border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--primary2);border-right-color:var(--accent);border-radius:50%;animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

.result-box{display:none;padding:16px;border-radius:14px;margin-top:14px}
.result-box.show{display:block;animation:resultIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes resultIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.result-box.success{background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(52,211,153,0.05));border:1.5px solid rgba(16,185,129,0.3);box-shadow:0 0 24px rgba(16,185,129,0.15)}
.result-box.error{background:linear-gradient(135deg,rgba(239,68,68,0.12),rgba(239,68,68,0.05));border:1.5px solid rgba(239,68,68,0.3);box-shadow:0 0 24px rgba(239,68,68,0.15)}

.toast{position:fixed;top:16px;right:16px;z-index:9999;background:rgba(18,18,26,0.95);backdrop-filter:blur(16px);border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,0.4);border-left:3px solid var(--primary2);max-width:320px;animation:toastIn .3s ease}
.toast strong{display:block;margin-bottom:3px;font-size:.85rem;font-weight:700}
.toast small{cursor:pointer;opacity:.5;display:block;margin-top:5px;font-size:.6rem;text-align:right}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.particle{position:fixed;pointer-events:none;z-index:9998;border-radius:50%}
.confetti{position:fixed;pointer-events:none;z-index:9997;width:8px;height:8px}

@media(max-width:768px){.items-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.container{padding:10px}.hero{padding:20px 14px}.hero h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">BCSFE ULTIMATE <span class="badge">v10.0</span></div>
  </header>

  <div class="hero">
    <h1>BCSFE ULTIMATE</h1>
    <p>전체 기능 무료 충전 — 키만 있으면 즉시 사용</p>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-list-check"></i>이용 방법</div>
    <ol style="padding-left:18px;color:var(--sub);font-size:.82rem;line-height:1.9">
      <li>원하는 아이템/기능을 선택하세요</li>
      <li>기기이전 코드와 인증번호를 입력하세요</li>
      <li>"지급하기" 버튼으로 자동 충전</li>
      <li>완료 후 새 코드를 갤러리에 저장</li>
    </ol>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-cart-shopping"></i>아이템 선택</div>
    <div class="tabs" id="categoryTabs"></div>
    <div class="items-grid" id="itemsGrid"></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="total-box" id="totalBox" style="display:none;"><div class="label">선택 아이템</div><div class="count" id="totalCount">0</div></div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fas fa-key"></i>계정 정보</div>
    <div class="input-wrap"><input type="text" id="transferCode" placeholder="기기이전 코드 (16자리)"><i class="fas fa-mobile-screen input-icon"></i></div>
    <div class="input-wrap"><input type="text" id="confirmationCode" placeholder="인증번호 (8자리 숫자)"><i class="fas fa-shield-halved input-icon"></i></div>
  </div>

  <button class="btn btn-success" onclick="startProcess()" id="payButton"><i class="fas fa-rocket"></i> 지급하기</button>
  <div id="processResult"></div>
  <div id="statusArea"></div>
  <div class="result-box" id="resultBox"><h4 id="resultTitle"></h4><div id="resultContent"></div></div>
</div>

<script>
const items = {{ items|tojson }};
let cart = {};
let currentTab = '통조림';
const categories = [...new Set(items.map(i => i.category))];

function renderTabs(){
  const cont = document.getElementById('categoryTabs');
  cont.innerHTML = categories.map(c => `<div class="tab ${c===currentTab?'active':''}" onclick="switchTab('${c}')">${c}</div>`).join('');
}
function switchTab(cat){currentTab = cat; renderTabs(); renderItems();}
function getCategoryIcon(cat){const icons = {'통조림':'🥫','XP':'✨','티켓':'🎟️','기타':'🎁','고양이추가':'🐱','고양이진화':'⭐','고양이강화':'📈','고양이특훈':'🎯','고양이도감':'📖'}; return icons[cat] || '📦';}

function renderItems(){
  const cont = document.getElementById('itemsGrid');
  const filtered = items.filter(i => i.category === currentTab);
  cont.innerHTML = filtered.map(item => {
    const qty = cart[item.id] || 0;
    const selected = qty > 0 ? 'selected' : '';
    let extraInputs = '';
    if (selected){
      if (item.needs_cat_id) extraInputs += `<div class="cat-inputs"><label>고양이 ID</label><input type="number" value="${cart[item.id+'_catId']||''}" oninput="saveCatId('${item.id}',this.value)"></div>`;
      if (item.needs_levels){
        extraInputs += `<div class="cat-inputs"><label>기본 레벨</label><input type="number" value="${cart[item.id+'_baseLv']||''}" oninput="saveLevels('${item.id}','base',this.value)"></div>`;
        extraInputs += `<div class="cat-inputs"><label>+ 레벨</label><input type="number" value="${cart[item.id+'_plusLv']||''}" oninput="saveLevels('${item.id}','plus',this.value)"></div>`;
      }
    }
    return `<div class="item-card ${selected}" onclick="toggleItem('${item.id}',event)" data-id="${item.id}">
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      ${selected?`<div style="position:absolute;top:6px;right:6px;background:var(--primary2);color:#fff;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:20px;box-shadow:0 0 8px rgba(99,102,241,0.5)">선택됨 ${qty}개</div>`:''}
      ${selected?`<div class="item-qty"><button onclick="event.stopPropagation();changeQty('${item.id}',-1,event)">−</button><span>${qty}</span><button onclick="event.stopPropagation();changeQty('${item.id}',1,event)">+</button></div>`:''}
      ${extraInputs}
    </div>`;
  }).join('');
}

function saveCatId(id,val){cart[id+'_catId']=val; renderCart();}
function saveLevels(id,type,val){cart[id+'_'+type+'Lv']=val; renderCart();}

function toggleItem(id,e){
  if (cart[id]){delete cart[id]; delete cart[id+'_catId']; delete cart[id+'_baseLv']; delete cart[id+'_plusLv'];}
  else {cart[id]=1;}
  renderItems(); renderCart(); updateTotal();
}

function changeQty(id,delta,e){
  const n = (cart[id]||0)+delta;
  if (n<=0){delete cart[id]; delete cart[id+'_catId']; delete cart[id+'_baseLv']; delete cart[id+'_plusLv'];}
  else cart[id]=n;
  renderItems(); renderCart(); updateTotal();
}

function renderCart(){
  const cont = document.getElementById('cartItems');
  const entries = Object.entries(cart).filter(([k]) => items.some(i => i.id === k));
  if (!entries.length){cont.innerHTML='';return;}
  cont.innerHTML = entries.map(([id,qty])=>{
    const item = items.find(i => i.id === id);
    if (!item) return '';
    let extra='';
    if (item.needs_cat_id && cart[id+'_catId']) extra += ` (ID:${cart[id+'_catId']})`;
    if (item.needs_levels) extra += ` (Lv:${cart[id+'_baseLv']||'?'}+${cart[id+'_plusLv']||'?'})`;
    return `<div class="cart-item"><div class="cart-item-name"><span>${item.icon}</span> ${item.name}${extra}</div><div class="cart-item-right"><span class="cart-item-qty">x${qty}</span><button class="cart-item-remove" onclick="removeFromCart('${id}',event)">✕</button></div></div>`;
  }).join('');
}

function removeFromCart(id,e){
  delete cart[id]; delete cart[id+'_catId']; delete cart[id+'_baseLv']; delete cart[id+'_plusLv'];
  renderItems(); renderCart(); updateTotal();
}

function updateTotal(){
  const count = Object.entries(cart).filter(([k]) => items.some(i => i.id === k)).reduce((a,[,v]) => a+v, 0);
  const box = document.getElementById('totalBox');
  if (count>0){box.style.display='block'; document.getElementById('totalCount').textContent = count+'개';}
  else box.style.display='none';
}

async function submitAndProcess(){
  const t = document.getElementById('transferCode').value.trim();
  const c = document.getElementById('confirmationCode').value.trim();
  if (!t||!c){toast('입력 오류','코드를 입력하세요.','var(--danger)');return;}
  const cartEntries = Object.entries(cart).filter(([k]) => items.some(i => i.id === k));
  if (!cartEntries.length){toast('입력 오류','아이템을 선택하세요.','var(--danger)');return;}
  for (const [id] of cartEntries){
    const item = items.find(i => i.id === id);
    if (item && item.needs_cat_id && !cart[id+'_catId']){toast('입력 오류',item.name+'의 고양이 ID를 입력하세요.','var(--danger)');return;}
  }
  const btn = document.getElementById('payButton');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 처리 중...';
  try{
    const payloadItems = cartEntries.map(([id,qty])=>{const obj={id,quantity:qty}; const item=items.find(i=>i.id===id); if(item&&item.needs_cat_id) obj.cat_id=parseInt(cart[id+'_catId'])||-1; if(item&&item.needs_levels){obj.base_level=parseInt(cart[id+'_baseLv'])||-1; obj.plus_level=parseInt(cart[id+'_plusLv'])||-1;} return obj;});
    const res = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_name:'user',transfer_code:t,confirmation_code:c,items:payloadItems})});
    const data = await res.json();
    if (data.error){toast('오류',data.error,'var(--danger)');btn.disabled=false;btn.innerHTML='<i class="fas fa-rocket"></i> 지급하기';return;}
    const res2 = await fetch('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:data.order_id})});
    const data2 = await res2.json();
    if (data2.error){toast('오류',data2.error,'var(--danger)');btn.disabled=false;btn.innerHTML='<i class="fas fa-rocket"></i> 지급하기';return;}
    document.getElementById('processResult').innerHTML='<div class="status-bar pending"><span class="spinner"></span> 처리 중... (30초~1분)</div>';
    startPolling(data2.order_id);
  }catch(e){toast('오류','서버 연결 실패','var(--danger)');}
  btn.disabled=false; btn.innerHTML='<i class="fas fa-rocket"></i> 지급하기';
}

function startProcess(){submitAndProcess();}

let pollInterval=null;
function startPolling(orderId){
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async ()=>{
    try{
      const res = await fetch('/api/order/'+orderId);
      const order = await res.json();
      document.getElementById('statusArea').innerHTML = '<div class="card" style="border-color:rgba(99,102,241,0.2);"><div class="card-title"><i class="fas fa-arrows-rotate"></i>처리 현황</div><div class="status-bar '+(order.status==='processing'?'pending':order.status==='completed'?'success':'error')+'">'+(order.status==='processing'?'<span class="spinner"></span> 처리 중...':'')+(order.status==='completed'?'<i class="fas fa-check-circle"></i> 처리 완료!':'')+(order.status==='failed'?'<i class="fas fa-times-circle"></i> 처리 실패':'')+(order.status==='pending'?'<i class="fas fa-clock"></i> 대기 중':'')+'</div></div>';
      if (order.status==='completed'||order.status==='failed'){clearInterval(pollInterval);pollInterval=null;showResult(order);}
    }catch(e){}
  },2000);
}

function showResult(order){
  const rb=document.getElementById('resultBox'); const rt=document.getElementById('resultTitle'); const rc=document.getElementById('resultContent');
  rb.className='result-box show '+(order.status==='completed'?'success':'error');
  if (order.status==='completed'){
    const r=order.result;
    rt.innerHTML='<i class="fas fa-check-circle"></i> 충전 완료!';
    confetti();
    let d='';
    if (r.details && r.details.length){d='<div style="margin-top:10px;font-size:.75rem;color:var(--sub);">'; r.details.forEach(x=>d+='<div>'+(x.success?'✅':'❌')+' '+x.message+'</div>'); d+='</div>';}
    rc.innerHTML='<div style="font-weight:700;color:var(--success);margin-bottom:8px;">새 코드 발급 완료!</div>'+
      '<div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;"><div style="font-size:.7rem;color:var(--sub);">새 전송코드</div><div style="font-weight:700;color:var(--success);font-size:.95rem;">'+(r.new_transfer_code||'N/A')+'</div></div>'+
      '<div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;"><div style="font-size:.7rem;color:var(--sub);">새 인증번호</div><div style="font-weight:700;color:var(--primary2);font-size:.95rem;">'+(r.new_confirmation_code||'N/A')+'</div></div>'+
      d+'<button class="btn btn-success" onclick="saveAsImage()" style="margin-top:12px;"><i class="fas fa-image"></i> 이미지로 저장</button>';
  } else {
    rt.innerHTML='<i class="fas fa-times-circle"></i> 충전 실패';
    rc.innerHTML='<div style="color:var(--sub);font-size:.82rem;">'+(order.result?.error||'오류')+'</div>';
  }
  rb.scrollIntoView({behavior:'smooth'});
}

function saveAsImage(){
  const newTc = document.getElementById('newTc')?document.getElementById('newTc').textContent:'N/A';
  const newCc = document.getElementById('newCc')?document.getElementById('newCc').textContent:'N/A';
  toast('이미지 저장','이미지를 생성 중입니다...','var(--accent)');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width=800; canvas.height=500;
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,800,500);
  ctx.strokeStyle='rgba(99,102,241,0.4)'; ctx.lineWidth=3; ctx.strokeRect(10,10,780,480);
  ctx.fillStyle='#818cf8'; ctx.font='bold 28px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('BCSFE Ultimate v10.0',400,50);
  ctx.fillStyle='#94a3b8'; ctx.font='16px Inter,sans-serif';
  ctx.fillText('새 기기이전 코드 & 인증번호',400,90);
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.strokeStyle='rgba(99,102,241,0.3)'; ctx.lineWidth=2;
  roundRect(ctx,40,120,720,140,12); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='bold 14px Inter,sans-serif'; ctx.textAlign='left';
  ctx.fillText('새 전송코드',60,150);
  ctx.fillStyle='#34d399'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
  ctx.fillText(newTc,400,220);
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.strokeStyle='rgba(99,102,241,0.3)';
  roundRect(ctx,40,290,720,140,12); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.font='bold 14px Inter,sans-serif'; ctx.textAlign='left';
  ctx.fillText('새 인증번호',60,320);
  ctx.fillStyle='#818cf8'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
  ctx.fillText(newCc,400,390);
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.download='nyanko-codes-'+Date.now()+'.png'; a.href=url; a.click();
    toast('저장 완료','이미지가 다운로드되었습니다.','var(--success)');
  },'image/png');
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function toast(t,m,c){const d=document.createElement('div');d.className='toast';d.style.borderLeftColor=c||'var(--primary2)';d.innerHTML='<strong>'+t+'</strong>'+m.replace(/\n/g,'<br>')+'<small onclick="this.parentElement.classList.add(\'out\');setTimeout(()=>this.parentElement.remove(),300)">닫기</small>';document.body.appendChild(d);setTimeout(()=>{if(d.parentElement){d.classList.add('out');setTimeout(()=>d.remove(),300);}},8000);}

document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(b) addRipple(e,b);});
renderTabs(); renderItems();
</script>
</body>
</html>
